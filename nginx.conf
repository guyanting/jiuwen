# 今日旧闻 — nginx 站点配置
#
# 用法：
#   1) 把 dist/ 整个目录上传到服务器，例如 /var/www/jiuwen
#   2) 把本文件放到 /etc/nginx/conf.d/jiuwen.conf，改掉 server_name 与 root
#   3) nginx -t && systemctl reload nginx
#   4) 证书可用 certbot --nginx -d example.com 自动签发
#
# 关键点：index.html 与 data/current.json 必须走 no-cache，
# 否则旧一期会被浏览器/CDN 缓存住，用户看到的永远是上一天的内容。

server {
    listen 80;
    listen [::]:80;
    server_name jiuwen.example.com;

    root /var/www/jiuwen;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 强制 https（证书就绪后取消注释）
    # return 301 https://$host$request_uri;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 页面内联了样式与脚本，CSP 需允许 inline；如需更严可改为 nonce/hash
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'" always;

    # 首页：每次回源校验，命中 ETag 时仍是 304，不重复下载
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
    }

    # 每日数据：绝不能被缓存，否则「就地刷新」永不生效
    location = /data/current.json {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type application/json;
    }

    # 社交分享图与图标：可长缓存
    location ~* \.(png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location = /robots.txt { add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        types { }
        default_type application/xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;

    access_log /var/log/nginx/jiuwen.access.log;
    error_log  /var/log/nginx/jiuwen.error.log warn;
}

